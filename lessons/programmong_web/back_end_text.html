<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="pass">
    <meta name="theme-color" content="#07110b">
    <title>pass</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #07110b;
            --panel: #0d1b12;
            --line: #294333;
            --text: #f2fff4;
            --muted: #b9cbbd;
            --green: #48f477;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 16px/1.9 Tahoma, Arial, sans-serif;
        }

        main {
            width: min(820px, calc(100% - 32px));
            margin: 0 auto;
            padding: 30px 0 56px;
            animation: enter .45s ease-out both;
        }

        a {
            color: var(--green);
        }

        .back {
            display: inline-block;
            margin-bottom: 26px;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .tag {
            color: var(--green);
            font-weight: 700;
        }

        h1 {
            margin: 8px 0 12px;
            font-size: clamp(1.8rem, 5vw, 2.7rem);
            line-height: 1.4;
        }

        .lead {
            color: var(--muted);
            font-size: 1.08rem;
        }

        section {
            margin-top: 24px;
            padding: 20px;
            border: 1px solid var(--line);
            border-right: 4px solid var(--green);
            background: var(--panel);
        }

        h2 {
            margin: 0 0 8px;
            font-size: 1.25rem;
        }

        p {
            margin: 8px 0;
        }

        ul,
        ol {
            margin: 8px 0 0;
            padding-right: 24px;
        }

        li {
            margin: 6px 0;
        }

        @keyframes enter {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media(prefers-reduced-motion:reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
    <main>
        <a class="back" href="../../index.html">بازگشت به صفحه اصلی</a>
        <span class="tag">MCD</span>
        <h1>pass</h1>
        <p class="lead">pass</p>
        <section>
            <h2>pass</h2>
            <p>pass</p>
        </section>
        <section>
            <h2>pass</h2>
            <ol>
                <li>pass</li>
                <li>pass</li>
                <li style="color: red;">pass</li>
                <li style="color: aqua;">pass</li>
            </ol>
        </section>
        <section>
            <h2>pass</h2>
            <p>pass</p>
            <p style="background-color: #07110b;">pass<a href="#" style="color: red; text-shadow: -10px 10px 5px red;"> pass </a></p>
        </section>
    </main>
</body>

</html>
