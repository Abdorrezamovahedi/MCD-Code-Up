<script id="mcd-theme-boot">(function(){try{var saved=localStorage.getItem('mcd-theme');var dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=(saved==='light'||saved==='dark')?saved:(dark?'dark':'light');}catch(e){document.documentElement.dataset.theme='light';}})();</script>
<title>صفحه در حال تکمیل | MCD Code Up</title>
<style>
:root{color-scheme:light;--bg:#f7f8f7;--ink:#202722;--muted:#68736c;--line:#e5e9e6;--green:#25835b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,Arial,sans-serif;line-height:1.9}
main{width:min(760px,calc(100% - 32px));margin:10vh auto;padding:28px}
article{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(22px,5vw,42px);box-shadow:0 3px 18px #1b2b1f08}
small{color:var(--green);font-weight:600}
h1{font-size:clamp(1.5rem,4vw,2.3rem);margin:12px 0}
p{color:var(--muted)}
a{display:inline-block;color:var(--green);text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:9px 16px}
a:hover{background:#eaf4ee}
</style>
<meta content="#f6f8f6" name="theme-color"/>
